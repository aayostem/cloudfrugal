[project]
name = "finops-scan"
version = "0.1.0"
description = "Read-only AWS FinOps gap scanner — the diagnostic core of the FinOps + IDP Engineering engagement, packaged standalone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ayobami Adejumo / Cloudfrugal" }
]
dependencies = [
  "boto3>=1.34",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "moto>=5.0",
]

[project.scripts]
finops-scan = "finops_scan.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
